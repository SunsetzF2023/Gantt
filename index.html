<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Workload Calendar</title>
<style>
:root{
  --row-h:40px;
  --border:#e3e6ea;
  --ink:#24292f;
  --muted:#6b7280;
  --bg:#f7f8fa;
  --panel:#fff;
  --input:#fff;
  --head:#f2f4f7;
  --we:#f6f8fa;
  --hover:#f6f8fa;
  --today:#ddf4ff;
  --today-ink:#0969da;
  --accent:#0969da;
  --overdue:#d1242f;
  --shadow:rgba(0,0,0,.08);
}
body.dark{
  --border:#30363d;
  --ink:#e6edf3;
  --muted:#8b949e;
  --bg:#0d1117;
  --panel:#161b22;
  --input:#0d1117;
  --head:#21262d;
  --we:#1c2128;
  --hover:#21262d;
  --today:#0c2d6b;
  --today-ink:#58a6ff;
  --accent:#2f81f7;
  --overdue:#f85149;
  --shadow:rgba(0,0,0,.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px/1.45 "Segoe UI","Microsoft YaHei",sans-serif;color:var(--ink);display:flex;flex-direction:column;background:var(--bg)}
header{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:16px;font-weight:600}
.snap-banner{background:#fff7e0;color:#7a5b00;padding:2px 10px;border-radius:10px;font-size:12px}
body.dark .snap-banner{background:#3b2f00;color:#d4a017}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toolbar select,.toolbar input,.toolbar button{font:inherit;padding:4px 8px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--ink);cursor:pointer}
.toolbar button:hover{background:var(--hover)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{filter:brightness(.9)}
.spacer{flex:1}
.scroll{flex:1;overflow:auto;background:var(--panel)}
.grid{display:flex;flex-direction:column;min-height:100%}
.left{background:var(--panel);width:max-content;border-bottom:2px solid var(--border)}
.lrow{display:flex;border-bottom:1px solid var(--border);height:var(--row-h);align-items:stretch}
.lhead{height:34px;background:var(--head);font-weight:600;color:var(--muted);font-size:12px;position:sticky;top:0;z-index:5}
.cell{flex:none;position:relative;padding:6px 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-right:1px solid var(--border);display:flex;align-items:center}
.cell.ctr{justify-content:center}
.cell.muted{color:var(--muted);font-size:12px}
.cell.over{color:var(--overdue);font-weight:600}
.lhead .cell{user-select:none;cursor:pointer}
.lhead .cell .car{margin-left:4px;font-size:10px;color:var(--muted)}
.lhead .cell.filtered .car,.lhead .cell.sorted .car{color:var(--accent)}
.lhead .cell .fmark{color:var(--accent);margin-left:2px;font-size:10px}
#colpop{position:fixed;z-index:60;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px var(--shadow);width:230px;display:none;flex-direction:column;font-size:12px;color:var(--ink)}
#colpop .ppsort{display:flex;border-bottom:1px solid var(--border)}
#colpop .ppsort button{flex:1;padding:7px 4px;background:none;border:none;color:var(--ink);cursor:pointer;font:inherit;font-size:12px}
#colpop .ppsort button:hover{background:var(--hover)}
#colpop .ppsort button+button{border-left:1px solid var(--border)}
#colpop .psearch{padding:6px 8px;border-bottom:1px solid var(--border)}
#colpop .psearch input{width:100%;padding:4px 6px;border:1px solid var(--border);border-radius:5px;background:var(--input);color:var(--ink);font:inherit;font-size:12px}
#colpop .pvals{max-height:220px;overflow:auto;padding:4px 0}
#colpop .pvals label{display:flex;align-items:center;gap:6px;padding:3px 10px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#colpop .pvals label:hover{background:var(--hover)}
#colpop .pclear{padding:6px 8px;border-top:1px solid var(--border)}
#colpop .pclear button{width:100%;padding:4px;border:1px solid var(--border);border-radius:5px;background:var(--input);color:var(--overdue);cursor:pointer;font:inherit;font-size:12px}
.grip{position:absolute;right:0;top:0;width:7px;height:100%;cursor:col-resize}
.grip:hover,.grip.on{background:#0969da55}
.cell select{font:inherit;font-size:11px;border:1px solid var(--border);border-radius:10px;padding:2px 6px;cursor:pointer;background:var(--input);color:var(--ink);max-width:100%}
.cell select.stsel{color:#fff;border:none}
.st-todo{background:#57606a!important}
.st-doing{background:#0969da!important}
.st-paused{background:#bf8700!important}
.st-done{background:#1a7f37!important}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;color:#fff;font-size:11px}
.lrow.task{cursor:pointer}
.lrow.task:hover{background:var(--hover)}
.lrow.task.done .k-name{color:var(--muted);text-decoration:line-through}
#cfields{display:contents}
/* ---- calendar ---- */
.cal{display:flex;flex-direction:column;padding:10px 14px}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;color:var(--muted);font-weight:600;text-align:center;padding:4px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(96px,auto);border-top:1px solid var(--border);border-left:1px solid var(--border)}
.daycell{border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:3px 4px;display:flex;flex-direction:column;gap:2px;overflow:hidden;cursor:pointer}
.daycell:hover{background:var(--hover)}
.daycell.we{background:var(--we)}
.daycell.we:hover{background:var(--hover)}
.daycell.dim .dnum{color:var(--muted);opacity:.55}
.daycell.today{background:var(--today)}
.dnum{font-size:11px;font-weight:600;color:var(--muted)}
.daycell.today .dnum{color:var(--today-ink)}
.chip{font-size:11px;line-height:1.3;padding:1px 6px;border-radius:4px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.chip:hover{filter:brightness(1.15)}
.chip.done{opacity:.45;text-decoration:line-through}
.chip.overdue{outline:2px solid var(--overdue);outline-offset:-1px}
.more{font-size:10px;color:var(--muted);padding-left:4px}
#gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:none;align-items:center;justify-content:center}
.gate-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:28px 32px;width:min(420px,92vw);box-shadow:0 8px 30px var(--shadow);display:flex;flex-direction:column;gap:14px}
.gate-card h2{font-size:18px}
.gate-card p{color:var(--muted)}
#gateForm{display:flex;flex-direction:column;gap:10px}
#gateForm input{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--ink)}
#gateForm button,#gateOut{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:6px;cursor:pointer;background:var(--input);color:var(--ink)}
#gateForm button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
#gateForm button:disabled{opacity:.6;cursor:default}
#gateNote{min-height:18px;font-size:12px;color:#1a7f37}
#gateNote.err{color:var(--overdue)}
#gateLocal{font-size:12px;color:var(--muted);text-align:center}
.userbox{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.userbox button{font:inherit;font-size:12px;padding:3px 8px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--ink);cursor:pointer}
.sync{font-size:12px;color:var(--muted)}
.sync.live{color:#1a7f37}
.sync.err{color:var(--overdue)}
.colrow{display:grid;grid-template-columns:52px 24px 1fr 130px 30px;gap:6px;align-items:center;padding:4px 0}
.colrow input[type=text],.colrow select{font:inherit;padding:4px 6px;border:1px solid var(--border);border-radius:6px;width:100%;background:var(--input);color:var(--ink)}
.colrow .opts{grid-column:3/6;font-size:11px}
.colrow button{padding:2px 6px;font:inherit;border:1px solid var(--border);border-radius:5px;background:var(--input);color:var(--ink);cursor:pointer}
.colrow .tag{font-size:11px;color:var(--muted)}
#colList{max-height:52vh;overflow:auto;padding:8px 18px}
.addrow{display:flex;gap:8px;padding:8px 18px;border-top:1px solid var(--border);align-items:center}
.addrow input,.addrow select{font:inherit;padding:4px 6px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--ink)}
.empty{padding:60px;text-align:center;color:var(--muted)}
dialog{border:none;border-radius:10px;padding:0;width:420px;box-shadow:0 8px 30px rgba(0,0,0,.2);background:var(--panel);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg-head{padding:14px 18px;border-bottom:1px solid var(--border);font-weight:600}
.dlg-body{padding:16px 18px;display:grid;grid-template-columns:90px 1fr;gap:10px 12px;align-items:center}
.dlg-body label{font-size:12px;color:var(--muted);text-align:right}
.dlg-body input,.dlg-body select,.dlg-body textarea{font:inherit;padding:5px 8px;border:1px solid var(--border);border-radius:6px;width:100%;background:var(--input);color:var(--ink)}
.dlg-foot{padding:12px 18px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.dlg-foot .right-btns{display:flex;gap:8px}
.dlg-foot button{font:inherit;padding:5px 12px;border:1px solid var(--border);border-radius:6px;background:var(--input);color:var(--ink);cursor:pointer}
.dlg-foot button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
/* ---- advanced dialog / detail panel ---- */
#advToggle{grid-column:1/3;background:none;border:1px dashed var(--border);border-radius:6px;padding:5px;color:var(--muted);cursor:pointer;font:inherit;font-size:12px;text-align:center}
#advToggle:hover{background:var(--hover)}
#advFields{display:none;grid-column:1/3;grid-template-columns:90px 1fr;gap:10px 12px;align-items:center}
#advFields.open{display:grid}
#advFields label{font-size:12px;color:var(--muted);text-align:right}
#advFields input,#advFields textarea{font:inherit;padding:5px 8px;border:1px solid var(--border);border-radius:6px;width:100%;background:var(--input);color:var(--ink)}
.attlist{display:flex;flex-direction:column;gap:3px;font-size:12px}
.attlist .att{display:flex;align-items:center;gap:6px}
.attlist .att button{border:none;background:none;color:var(--overdue);cursor:pointer;font:inherit}
.info-cell{width:34px;flex:none;justify-content:center}
.info-btn{border:none;background:none;cursor:pointer;color:var(--muted);font-size:14px;border-radius:50%;width:22px;height:22px;line-height:1}
.info-btn:hover{background:var(--hover);color:var(--accent)}
.tagc{display:inline-block;padding:0 7px;border-radius:8px;color:#fff;font-size:10px;margin-right:3px;line-height:16px}
.dd-body{padding:14px 20px;max-height:62vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.dd-sec h3{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:3px}
.dd-sec .dd-txt{white-space:pre-wrap;font-size:13px;line-height:1.5}
.dd-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 16px;font-size:12px}
.dd-meta span{color:var(--muted)}
.dd-body img{max-width:100%;border-radius:6px;border:1px solid var(--border);margin-top:4px}
.dd-att a{color:var(--accent);font-size:12px}
footer{padding:6px 16px;background:var(--panel);border-top:1px solid var(--border);font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:4px}
.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
</style>
</head>
<body>
<header>
  <h1>Workload Calendar</h1>
  <span id="snapBanner" class="snap-banner" style="display:none"></span>
  <div class="toolbar">
    <button class="primary edit-only" id="btnAdd">+ New Task</button>
    <button id="btnPrev">◀</button>
    <button id="btnToday">Today</button>
    <button id="btnNext">▶</button>
    <span id="monthLabel" style="font-weight:600;min-width:110px;text-align:center"></span>
    <select id="selAssignee"><option value="">All assignees</option></select>
    <label style="display:flex;align-items:center;gap:4px"><input type="checkbox" id="chkDone"> Hide done</label>
    <button id="btnDark">Dark mode</button>
    <div class="spacer"></div>
    <button class="edit-only" id="btnImport">Import JSON</button>
    <button class="edit-only" id="btnExport">Export JSON</button>
    <button class="edit-only" id="btnExcel" title="Download as a real .xlsx workbook">Export Excel</button>
    <button class="edit-only" id="btnSnap" title="Generate a read-only HTML to share">Export Snapshot</button>
    <button class="edit-only" id="btnLabels" title="Rename column headers">⚙ Columns</button>
    <span id="syncStatus" class="sync" style="display:none"></span>
    <span id="userBox" class="userbox" style="display:none"><span id="userText"></span><button id="btnSignOut">Sign out</button></span>
  </div>
</header>
<div id="gate">
  <div class="gate-card">
    <h2>Workload Calendar</h2>
    <p id="gateMsg">Sign in to view the live schedule.</p>
    <div id="gateForm">
      <input id="gateEmail" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false">
      <input id="gatePass" type="password" placeholder="Password" autocomplete="current-password">
      <button class="primary" id="gateSend">Sign in</button>
    </div>
    <div id="gateNote"></div>
    <button id="gateOut" style="display:none">Sign out</button>
    <a href="#" id="gateLocal">Use locally without signing in</a>
  </div>
</div>
<div class="scroll" id="scroll">
  <div class="grid">
    <div class="left" id="left"></div>
    <div class="cal" id="cal"></div>
  </div>
</div>
<footer>
  <span class="lg"><i style="outline:2px solid var(--overdue);outline-offset:-2px;background:transparent"></i>Overdue</span>
  <span class="lg"><i style="background:#57606a"></i>Not Started</span>
  <span class="lg"><i style="background:#0969da"></i>In Progress</span>
  <span class="lg"><i style="background:#bf8700"></i>Paused</span>
  <span class="lg"><i style="background:#1a7f37"></i>Done</span>
  <span id="assigneeLegend"></span>
</footer>

<dialog id="dlg">
  <div class="dlg-head" id="dlgTitle">Edit Task</div>
  <div class="dlg-body">
    <label data-col="name">Task Name</label><input id="fName">
    <label data-col="who">Assigned By</label><input id="fWho" list="whoList"><datalist id="whoList"></datalist>
    <label data-col="ddl">Deadline</label><input id="fDdl" type="text" inputmode="numeric" placeholder="e.g. 27 or 11/27 or 2026-11-27">
    <label data-col="status">Status</label>
    <select id="fStatus">
      <option value="todo">Not Started</option>
      <option value="doing">In Progress</option>
      <option value="paused">Paused</option>
      <option value="done">Done</option>
    </select>
    <div id="cfields"></div>
    <button type="button" id="advToggle">Advanced ▾</button>
    <div id="advFields">
      <label data-col="content">Description</label><textarea id="fContent" rows="2"></textarea>
      <label data-col="start">Start date</label><input id="fStartD" type="text" inputmode="numeric" placeholder="optional, e.g. 25 or 11/25">
      <label data-col="tags">Tags</label><input id="fTags" list="tagList" placeholder="comma separated, e.g. network, urgent"><datalist id="tagList"></datalist>
      <label>Deploy plan</label><textarea id="fDeploy" rows="2"></textarea>
      <label>Backout plan</label><textarea id="fBackout" rows="2"></textarea>
      <label>Attachments</label><span><input type="file" id="fAtt" multiple style="font-size:12px"><span style="font-size:11px;color:var(--muted)">max ~300KB each</span></span>
      <label></label><div class="attlist" id="attList"></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button id="fDel" style="color:var(--overdue)">Delete</button>
    <div class="right-btns">
      <button id="fCancel">Cancel</button>
      <button class="primary" id="fSave">Save</button>
    </div>
  </div>
</dialog>

<dialog id="dlgLabels" style="width:620px">
  <div class="dlg-head">Manage Columns</div>
  <div id="colList"></div>
  <div class="addrow">
    <input id="newColName" placeholder="New column name, e.g. Priority" style="flex:1">
    <select id="newColType">
      <option value="text">Text</option>
      <option value="dropdown">Dropdown</option>
      <option value="date">Date</option>
      <option value="number">Number</option>
    </select>
    <button id="lAdd" class="primary">+ Add column</button>
  </div>
  <div class="dlg-foot">
    <button id="lReset" style="color:var(--overdue)">Reset to default</button>
    <div class="right-btns">
      <button id="lChinese">中文预设</button>
      <button id="lCancel">Cancel</button>
      <button class="primary" id="lSave">Save</button>
    </div>
  </div>
</dialog>
<dialog id="dlgDetail" style="width:560px">
  <div class="dlg-head" id="ddTitle"></div>
  <div class="dd-body" id="ddBody"></div>
  <div class="dlg-foot">
    <span></span>
    <div class="right-btns">
      <button id="ddEdit" class="edit-only">Edit</button>
      <button class="primary" id="ddClose">Close</button>
    </div>
  </div>
</dialog>
<input type="file" id="fileInput" accept=".json" style="display:none">
<div id="colpop"></div>

<script src="supabase.js"></script>
<script>
const DAY=86400000;
const $=s=>document.getElementById(s);
const PALETTE=['#0969da','#8250df','#1a7f37','#bf8700','#cf222e','#0e7c86','#d4a017','#57606a'];
const ST_COLOR={todo:'#57606a',doing:'#0969da',paused:'#bf8700',done:'#1a7f37'};

const EN_LABELS={name:'Task',content:'Content',who:'Assigned By',ddl:'Deadline',status:'Status',prog:'Progress',tags:'Tags',start:'Start'};
const CN_LABELS={name:'任务',content:'任务内容',who:'指派人',ddl:'截止时间',status:'状态',prog:'进度',tags:'标签',start:'开始日期'};
const BUILTIN_W={name:200,content:220,who:110,ddl:100,status:124,prog:72,tags:130,start:90};
const defaultCols=()=>['name','tags','content','who','ddl','status','prog','start'].map(id=>({id,label:EN_LABELS[id],builtin:true,visible:id!=='start',w:BUILTIN_W[id]}));
let COLS=defaultCols();
const colById=id=>COLS.find(c=>c.id===id);
const L=id=>(colById(id)||{label:EN_LABELS[id]||id}).label;
const visCols=()=>COLS.filter(c=>c.visible);
function normCols(saved){
  const out=[];const seen=new Set();
  for(const s of saved||[]){
    if(!s||!s.id||seen.has(s.id))continue;
    if(s.builtin&&!EN_LABELS[s.id])continue;
    seen.add(s.id);
    out.push({id:s.id,label:s.label||EN_LABELS[s.id]||'Column',builtin:!!s.builtin,visible:s.visible!==false,w:s.w||BUILTIN_W[s.id]||130,
      ...(s.builtin?{}:{type:s.type||'text',options:s.options||[]})});
  }
  for(const c of defaultCols())if(!seen.has(c.id))out.push(c);
  return out;
}
function saveCols(){
  if(SNAPSHOT)return;
  if(MODE==='local')localStorage.setItem('gantt-cols',JSON.stringify(COLS));
  else cloudSave();
}

const snapEl=document.querySelector('script[type="application/json"][id="snapshot-data"]');
let SNAPSHOT=!!snapEl;
let MODE=snapEl?'snapshot':'cloud';
let tasks=[], viewMonth;

function loadLocal(){
  tasks=JSON.parse(localStorage.getItem('gantt-tasks')||'null')||sample();
  const sc=JSON.parse(localStorage.getItem('gantt-cols')||'null');
  if(sc)COLS=normCols(sc);
  else{
    const old=JSON.parse(localStorage.getItem('gantt-labels')||'{}');
    COLS=defaultCols();COLS.forEach(c=>{if(old[c.id])c.label=old[c.id]});
  }
}
if(snapEl){
  const snap=JSON.parse(snapEl.textContent);
  tasks=snap.tasks||snap;
  if(snap.cols)COLS=normCols(snap.cols);
  viewMonth=snap.viewMonth||null;
  document.querySelectorAll('.edit-only').forEach(e=>e.style.display='none');
  $('snapBanner').style.display='';
  $('snapBanner').textContent='Read-only snapshot · generated '+(snap.generated||'');
  window.__snapHideDone=!!snap.hideDone;
}else{
  viewMonth=JSON.parse(localStorage.getItem('gantt-viewmonth')||'null');
  document.querySelectorAll('.edit-only').forEach(e=>e.style.display='none');
}
viewMonth=viewMonth?parseISO(viewMonth):new Date(today().getFullYear(),today().getMonth(),1);
viewMonth=new Date(viewMonth.getFullYear(),viewMonth.getMonth(),1);

function sample(){
  const t=today(),d=o=>fmt(addDays(t,o));
  return [
    {id:1,name:'Q3 data report',who:'Alex Wong',ddl:d(6),status:'doing',prog:60,content:'Needs finance input'},
    {id:2,name:'Client demo prep',who:'Jing Chen',ddl:d(4),status:'todo',prog:0,content:''},
    {id:3,name:'Fix prod bug #4821',who:'Yang Liu',ddl:d(2),status:'doing',prog:30,content:'High priority'},
    {id:4,name:'Code review + docs',who:'Jing Chen',ddl:d(9),status:'todo',prog:0,content:''},
    {id:5,name:'Onboarding material',who:'Alex Wong',ddl:d(12),status:'todo',prog:0,content:''},
  ];
}

function today(){const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function parseISO(s){const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fmtShort(d){return (d.getMonth()+1)+'/'+d.getDate()}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function isWE(d){const w=d.getDay();return w===0||w===6}
function parseDateInput(str){
  str=(str||'').trim();
  if(!str)return '';
  let m=str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/);
  if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=str.match(/^(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?$/);
  if(m){
    let y=m[3]?+m[3]:today().getFullYear();if(y<100)y+=2000;
    if(!m[3]&&+m[1]<today().getMonth()+1)y++;
    return y+'-'+m[1].padStart(2,'0')+'-'+m[2].padStart(2,'0');
  }
  m=str.match(/^(\d{1,2})$/);
  if(m){
    const t=today();let y=t.getFullYear(),mo=t.getMonth();
    if(+m[1]<t.getDate()){mo++;if(mo>11){mo=0;y++}}
    return y+'-'+String(mo+1).padStart(2,'0')+'-'+m[1].padStart(2,'0');
  }
  return null;
}
function whoColor(who){
  let h=0;for(const c of who)h=(h*31+c.charCodeAt(0))>>>0;
  return PALETTE[h%PALETTE.length];
}
function visible(){
  let v=tasks;
  const f=$('selAssignee').value;
  if(f)v=v.filter(t=>t.who===f);
  if($('chkDone').checked)v=v.filter(t=>t.status!=='done');
  for(const c of COLS){
    const cf=colFilters[c.id];
    if(cf)v=v.filter(t=>cf.has(colVal(c,t)));
  }
  return v;
}
function isOverdue(t){return t.ddl&&t.status!=='done'&&parseISO(t.ddl)<today()}
function save(){
  if(SNAPSHOT)return;
  if(MODE==='local')localStorage.setItem('gantt-tasks',JSON.stringify(tasks));
  else cloudSave();
  saveView();
}
function saveView(){if(MODE!=='snapshot')localStorage.setItem('gantt-viewmonth',JSON.stringify(fmt(viewMonth)))}

const STATUS_OPTS=[['todo','Not Started'],['doing','In Progress'],['paused','Paused'],['done','Done']];
function cellHTML(c,t){
  const w=`data-cid="${c.id}" style="width:${c.w}px"`;
  switch(c.id){
    case 'name':return `<div class="cell k-name" ${w} title="${esc(t.name)}">${esc(t.name)}</div>`;
    case 'content':{const s=t.content||t.note||'';return `<div class="cell muted" ${w} title="${esc(s)}">${esc(s)}</div>`}
    case 'who':return `<div class="cell ctr" ${w}><span class="pill" style="background:${whoColor(t.who)}">${esc(t.who)}</span></div>`;
    case 'ddl':return `<div class="cell ctr ${isOverdue(t)?'over':''}" ${w}>${t.ddl?fmtShort(parseISO(t.ddl)):'—'}</div>`;
    case 'status':return `<div class="cell ctr" ${w}><select class="stsel st-${t.status}" data-sid="${t.id}" ${SNAPSHOT?'disabled':''}>${STATUS_OPTS.map(([v,n])=>`<option value="${v}" ${t.status===v?'selected':''}>${n}</option>`).join('')}</select></div>`;
    case 'prog':return `<div class="cell ctr" ${w}>${t.status==='done'?'✓':t.prog+'%'}</div>`;
    case 'tags':return `<div class="cell" ${w}>${(t.tags||[]).map(g=>`<span class="tagc" style="background:${whoColor(g)}">${esc(g)}</span>`).join('')}</div>`;
    case 'start':return `<div class="cell ctr" ${w}>${t.start?fmtShort(parseISO(t.start)):'—'}</div>`;
  }
  const v=(t.cv&&t.cv[c.id])??'';
  if(c.type==='dropdown')return `<div class="cell ctr" ${w}><select data-sid="${t.id}" data-cv="${c.id}" ${SNAPSHOT?'disabled':''}><option value=""></option>${(c.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select></div>`;
  const shown=c.type==='date'&&v?fmtShort(parseISO(v)):v;
  return `<div class="cell ${c.type==='text'?'':'ctr'}" ${w} title="${esc(v)}">${esc(shown)}</div>`;
}

const expandedDays=new Set();
const colFilters={};
let sortState=null;
function colVal(c,t){
  switch(c.id){
    case 'name':return t.name;
    case 'content':return t.content||t.note||'';
    case 'who':return t.who;
    case 'ddl':return t.ddl||'';
    case 'status':return STATUS_NAME[t.status]||t.status;
    case 'prog':return String(t.prog);
    case 'tags':return (t.tags||[]).join(', ');
    case 'start':return t.start||'';
  }
  return String((t.cv&&t.cv[c.id])??'');
}
function sortTasks(list){
  return list.sort((a,b)=>{
    if(sortState){
      const c=colById(sortState.col);
      if(c){
        const cmp=colVal(c,a).localeCompare(colVal(c,b),undefined,{numeric:true});
        if(cmp)return sortState.dir==='asc'?cmp:-cmp;
      }
    }else{
      const da=a.ddl||'9999',db=b.ddl||'9999';
      if(da!==db)return da<db?-1:1;
    }
    return a.name<b.name?-1:1;
  });
}

function render(){
  const list=sortTasks(visible());

  // left header + rows
  const vc=visCols();
  let lh=`<div class="lrow lhead">${vc.map(c=>`<div class="cell ctr hfilter" data-cid="${c.id}" data-hcol="${c.id}" style="width:${c.w}px">${esc(c.label)}<span class="fmark">${colFilters[c.id]?'⏷':''}</span><span class="car">${sortState&&sortState.col===c.id?(sortState.dir==='asc'?'↑':'↓'):'▾'}</span>${SNAPSHOT?'':`<span class="grip" data-grip="${c.id}"></span>`}</div>`).join('')}<div class="cell info-cell"></div></div>`;
  for(const t of list){
    lh+=`<div class="lrow task ${t.status}" data-id="${t.id}">${vc.map(c=>cellHTML(c,t)).join('')}<div class="cell info-cell"><button class="info-btn" data-info="${t.id}" title="Details">ⓘ</button></div></div>`;
  }
  if(!list.length)lh+=`<div class="empty">No tasks — click "+ New Task" to start</div>`;
  $('left').innerHTML=lh;

  // calendar
  const y=viewMonth.getFullYear(),m=viewMonth.getMonth();
  $('monthLabel').textContent='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ')[m]+' '+y;
  const first=new Date(y,m,1);
  const gridStart=addDays(first,-first.getDay());
  const byDate={};
  for(const t of list)if(t.ddl)(byDate[t.ddl]=byDate[t.ddl]||[]).push(t);
  let cal='<div class="cal-head">'+'Sun Mon Tue Wed Thu Fri Sat'.split(' ').map(d=>`<div>${d}</div>`).join('')+'</div><div class="cal-grid">';
  for(let i=0;i<42;i++){
    const d=addDays(gridStart,i),ds=fmt(d);
    const inMonth=d.getMonth()===m,isT=+d===+today();
    const dayTasks=byDate[ds]||[];
    const MAXC=expandedDays.has(ds)?dayTasks.length:4;
    let chips='';
    dayTasks.slice(0,MAXC).forEach(t=>{
      const tip=[t.name,`${L('who')}: ${t.who}`,`${L('ddl')}: ${t.ddl}`,`${L('prog')}: ${t.prog}%`,t.content||''].filter(Boolean).map(esc).join('&#10;');
      chips+=`<div class="chip ${t.status} ${isOverdue(t)?'overdue':''}" data-id="${t.id}" style="background:${ST_COLOR[t.status]}" title="${tip}">${esc(t.name)}</div>`;
    });
    if(dayTasks.length>MAXC)chips+=`<div class="more" data-more="${ds}" tabindex="0" role="button">+${dayTasks.length-MAXC} more</div>`;
    cal+=`<div class="daycell ${isWE(d)?'we':''} ${inMonth?'':'dim'} ${isT?'today':''}" data-date="${ds}"><span class="dnum">${d.getDate()}</span>${chips}</div>`;
  }
  cal+='</div>';
  $('cal').innerHTML=cal;

  // assignee filter + legend
  const whos=[...new Set(tasks.map(t=>t.who))];
  const cur=$('selAssignee').value;
  $('selAssignee').innerHTML='<option value="">All assignees</option>'+whos.map(w=>`<option ${w===cur?'selected':''}>${esc(w)}</option>`).join('');
  $('whoList').innerHTML=whos.map(w=>`<option value="${esc(w)}">`).join('');
  const allTags=[...new Set(tasks.flatMap(t=>t.tags||[]))];
  $('tagList').innerHTML=allTags.map(g=>`<option value="${esc(g)}">`).join('');
  $('assigneeLegend').innerHTML=whos.map(w=>`<span class="lg"><i style="background:${whoColor(w)}"></i>${esc(w)}</span>`).join(' ');

  // interactions
  if(!SNAPSHOT){
    document.querySelectorAll('.lrow.task,.chip').forEach(el=>
      el.addEventListener('click',e=>{e.stopPropagation();openDlg(+el.dataset.id)}));
    document.querySelectorAll('.daycell').forEach(el=>
      el.addEventListener('click',()=>openDlg(null,el.dataset.date)));
    document.querySelectorAll('.lrow.task select').forEach(sel=>{
      sel.addEventListener('click',e=>e.stopPropagation());
      sel.addEventListener('change',()=>{
        const t=tasks.find(x=>x.id===+sel.dataset.sid);
        if(!t)return;
        if(sel.dataset.cv){(t.cv=t.cv||{})[sel.dataset.cv]=sel.value}
        else{t.status=sel.value;if(t.status==='done')t.prog=100}
        save();render();
      });
    });
    document.querySelectorAll('.grip').forEach(g=>g.addEventListener('mousedown',e=>{
      e.preventDefault();e.stopPropagation();g.classList.add('on');
      const c=colById(g.dataset.grip),x0=e.clientX,w0=c.w;
      const mv=ev=>{c.w=Math.max(40,w0+ev.clientX-x0);
        document.querySelectorAll(`[data-cid="${c.id}"]`).forEach(el=>el.style.width=c.w+'px')};
      const up=()=>{g.classList.remove('on');saveCols();removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};
      addEventListener('mousemove',mv);addEventListener('mouseup',up);
    }));
  }else{
    document.querySelectorAll('.chip').forEach(el=>
      el.addEventListener('click',e=>e.stopPropagation()));
  }
  const expand=ds=>{expandedDays.add(ds);render();
    const cell=document.querySelector('.daycell[data-date="'+ds+'"]');
    if(cell){cell.tabIndex=-1;cell.focus()}
  };
  document.querySelectorAll('.more').forEach(el=>{
    el.addEventListener('click',e=>{e.stopPropagation();expand(el.dataset.more)});
    el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();expand(el.dataset.more)}});
  });
  document.querySelectorAll('.info-btn').forEach(el=>
    el.addEventListener('click',e=>{e.stopPropagation();openDetail(+el.dataset.info)}));
}

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

// ----- excel-style column filter popup -----
function closePop(){$('colpop').style.display='none';$('colpop').dataset.open=''}
function openPop(cid,anchorEl){
  const pop=$('colpop');
  pop.dataset.open=cid;
  pop.style.display='flex';
  pop.innerHTML='';
  fillPop(cid);
  const r=anchorEl.getBoundingClientRect();
  pop.style.left=Math.max(4,Math.min(r.left,innerWidth-240))+'px';
  pop.style.top=(r.bottom+4)+'px';
}
function fillPop(cid){
  const c=colById(cid);if(!c)return closePop();
  const pop=$('colpop');
  const old=pop.querySelector('.psearch input');
  const q=old?old.value:'';
  const vals=[...new Set(tasks.map(t=>colVal(c,t)))];
  vals.sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));
  const cf=colFilters[cid];
  const isOn=v=>!cf||cf.has(v);
  const shown=vals.filter(v=>!q||v.toLowerCase().includes(q.toLowerCase()));
  const allOn=shown.length>0&&shown.every(isOn);
  pop.innerHTML=`<div class="ppsort">
      <button data-act="asc">Sort A to Z</button>
      <button data-act="desc">Sort Z to A</button>
    </div>
    <div class="psearch"><input placeholder="Search" value="${esc(q)}"></div>
    <div class="pvals">
      <label><input type="checkbox" data-act="all" ${allOn?'checked':''}> (Select All)</label>
      ${shown.map(v=>`<label><input type="checkbox" data-v="${esc(v)}" ${isOn(v)?'checked':''}> <span title="${esc(v)||'(Blanks)'}">${esc(v)||'(Blanks)'}</span></label>`).join('')||'<div style="padding:6px 10px;color:var(--muted)">No values</div>'}
    </div>
    <div class="pclear"><button data-act="clear" ${cf?'':'disabled style="opacity:.5"'}>Clear filter</button></div>`;
  const inp=pop.querySelector('.psearch input');
  if(old||document.activeElement===document.body){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}
}
$('colpop').addEventListener('input',e=>{
  if(e.target.matches('.psearch input'))fillPop($('colpop').dataset.open);
});
$('colpop').addEventListener('change',e=>{
  const pop=$('colpop'),cid=pop.dataset.open,c=colById(cid);
  if(!c)return;
  const vals=[...new Set(tasks.map(t=>colVal(c,t)))];
  if(!colFilters[cid])colFilters[cid]=new Set(vals);
  const cf=colFilters[cid];
  const q=(pop.querySelector('.psearch input')||{}).value||'';
  const shown=vals.filter(v=>!q||v.toLowerCase().includes(q.toLowerCase()));
  if(e.target.dataset.act==='all'){
    shown.forEach(v=>e.target.checked?cf.add(v):cf.delete(v));
    pop.querySelectorAll('[data-v]').forEach(b=>{b.checked=cf.has(b.dataset.v)});
  }else if(e.target.dataset.v!==undefined){
    e.target.checked?cf.add(e.target.dataset.v):cf.delete(e.target.dataset.v);
    const allBox=pop.querySelector('[data-act=all]');
    if(allBox)allBox.checked=shown.length>0&&shown.every(v=>cf.has(v));
  }
  if(cf.size>=vals.length)delete colFilters[cid];
  const cb=pop.querySelector('[data-act=clear]');
  if(cb){cb.disabled=!colFilters[cid];cb.style.opacity=colFilters[cid]?'1':'.5'}
  render();
});
$('colpop').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const cid=$('colpop').dataset.open;
  if(b.dataset.act==='asc'||b.dataset.act==='desc'){
    sortState={col:cid,dir:b.dataset.act};render();closePop();return;
  }
  if(b.dataset.act==='clear'){
    delete colFilters[cid];render();fillPop(cid);
  }

});
document.addEventListener('click',e=>{
  const hc=e.target.closest('.hfilter');
  if(hc&&!e.target.closest('.grip')){
    const pop=$('colpop');
    if(pop.dataset.open===hc.dataset.hcol&&pop.style.display==='flex'){closePop();return}
    openPop(hc.dataset.hcol,hc);
    return;
  }
  if(!e.target.closest('#colpop'))closePop();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePop()});
$('scroll').addEventListener('scroll',closePop);
addEventListener('resize',closePop);

// ----- dialog -----
let editId=null;
function openDlg(id,presetDdl){
  editId=id;
  const t=id?tasks.find(x=>x.id===id):{name:'',who:'',ddl:presetDdl||fmt(addDays(today(),7)),status:'todo',prog:0,content:''};
  $('dlgTitle').textContent=id?'Edit Task':'New Task';
  $('fDel').style.visibility=id?'visible':'hidden';
  $('fName').value=t.name;$('fContent').value=t.content||t.note||'';$('fWho').value=t.who;
  $('fDdl').value=t.ddl||'';$('fStatus').value=t.status;
  $('fStartD').value=t.start||'';$('fTags').value=(t.tags||[]).join(', ');
  $('fDeploy').value=t.deploy||'';$('fBackout').value=t.backout||'';
  attDraft=(t.attachments||[]).map(a=>({...a}));
  drawAttList();
  $('advFields').classList.remove('open');
  $('advToggle').textContent='Advanced ▾';
  document.querySelectorAll('#advFields label[data-col]').forEach(l=>{if(EN_LABELS[l.dataset.col])l.textContent=L(l.dataset.col)});
  document.querySelectorAll('#dlg label[data-col]').forEach(l=>l.textContent=L(l.dataset.col));
  $('cfields').innerHTML=COLS.filter(c=>!c.builtin).map(c=>{
    const v=(t.cv&&t.cv[c.id])??'';
    const inp=c.type==='dropdown'?`<select id="cf_${c.id}"><option value=""></option>${(c.options||[]).map(o=>`<option ${o===v?'selected':''}>${esc(o)}</option>`).join('')}</select>`
      :`<input id="cf_${c.id}" type="${c.type==='number'?'number':c.type==='date'?'date':'text'}" value="${esc(v)}">`;
    return `<label>${esc(c.label)}</label>${inp}`;
  }).join('');
  $('dlg').showModal();
}
$('fDdl').addEventListener('blur',()=>{
  const p=parseDateInput($('fDdl').value);
  if(p)$('fDdl').value=p;
});
$('fStartD').addEventListener('blur',()=>{
  const p=parseDateInput($('fStartD').value);
  if(p)$('fStartD').value=p;
});
$('advToggle').onclick=()=>{
  const open=$('advFields').classList.toggle('open');
  $('advToggle').textContent=open?'Advanced ▴':'Advanced ▾';
};
let attDraft=[];
const ATT_MAX=300*1024;
function drawAttList(){
  $('attList').innerHTML=attDraft.map((a,i)=>`<div class="att"><span>${esc(a.name)} (${Math.round((a.data.length*3/4)/1024)}KB)</span><button data-i="${i}" title="Remove">✕</button></div>`).join('');
}
$('attList').addEventListener('click',e=>{
  const b=e.target.closest('button[data-i]');if(!b)return;
  attDraft.splice(+b.dataset.i,1);drawAttList();
});
$('fAtt').addEventListener('change',async e=>{
  for(const f of e.target.files){
    if(f.size>ATT_MAX){alert('"'+f.name+'" is over 300KB — please paste a link in the description instead.');continue}
    const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});
    attDraft.push({name:f.name,type:f.type,data});
  }
  e.target.value='';
  drawAttList();
});
$('btnAdd').onclick=()=>openDlg(null);
$('fCancel').onclick=()=>$('dlg').close();
$('fSave').onclick=()=>{
  const ddl=parseDateInput($('fDdl').value);
  if(ddl===null){alert('Cannot understand the deadline. Try formats like 27, 11/27 or 2026-11-27.');return}
  const sd=parseDateInput($('fStartD').value);
  if(sd===null){alert('Cannot understand the start date. Try formats like 25, 11/25 or 2026-11-25.');return}
  const old=editId?tasks.find(x=>x.id===editId):null;
  const t={
    name:$('fName').value.trim()||'Untitled task',who:$('fWho').value.trim()||'Unassigned',
    ddl,status:$('fStatus').value,
    prog:old?old.prog||0:0,content:$('fContent').value.trim(),
    start:sd,
    tags:$('fTags').value.split(',').map(x=>x.trim()).filter(Boolean),
    deploy:$('fDeploy').value.trim(),backout:$('fBackout').value.trim(),
    attachments:attDraft.map(a=>({...a}))
  };
  t.cv=Object.assign({},old&&old.cv);
  COLS.filter(c=>!c.builtin).forEach(c=>{const el=$('cf_'+c.id);if(el)t.cv[c.id]=el.value});
  if(t.status==='done')t.prog=100;
  t.start=(old&&old.start)||fmt(today());
  if(editId)Object.assign(tasks.find(x=>x.id===editId),t);
  else{t.id=Math.max(0,...tasks.map(x=>x.id))+1;tasks.push(t)}
  save();$('dlg').close();render();
};
$('fDel').onclick=()=>{
  const t=tasks.find(x=>x.id===editId);
  if(!confirm('Delete task "'+(t?t.name:'')+'"?'))return;
  tasks=tasks.filter(x=>x.id!==editId);save();$('dlg').close();render();
};

// ----- detail panel -----
function openDetail(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  $('ddTitle').textContent=t.name;
  const sec=(label,body)=>body?`<div class="dd-sec"><h3>${label}</h3>${body}</div>`:'';
  const txt=v=>`<div class="dd-txt">${esc(v)}</div>`;
  const stName=STATUS_NAME[t.status]||t.status;
  let html=`<div class="dd-meta">
    <div><span>${esc(L('status'))}:</span> ${esc(stName)}</div>
    <div><span>${esc(L('who'))}:</span> ${esc(t.who)}</div>
    <div><span>${esc(L('ddl'))}:</span> ${esc(t.ddl||'—')}${isOverdue(t)?' <b style="color:var(--overdue)">overdue</b>':''}</div>
    <div><span>${esc(L('start'))}:</span> ${esc(t.start||'—')}</div>
    ${(t.tags||[]).length?`<div style="grid-column:1/3">${t.tags.map(g=>`<span class="tagc" style="background:${whoColor(g)}">${esc(g)}</span>`).join('')}</div>`:''}
    ${COLS.filter(c=>!c.builtin&&(t.cv&&t.cv[c.id])).map(c=>`<div><span>${esc(c.label)}:</span> ${esc(t.cv[c.id])}</div>`).join('')}
  </div>`;
  html+=sec(esc(L('content')),txt(t.content||t.note||''));
  html+=sec('Deploy plan',txt(t.deploy||''));
  html+=sec('Backout plan',txt(t.backout||''));
  const att=(t.attachments||[]).map(a=>{
    if((a.type||'').startsWith('image/'))return `<div class="dd-att"><a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a><br><img src="${a.data}" alt="${esc(a.name)}"></div>`;
    return `<div class="dd-att"><a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a></div>`;
  }).join('');
  html+=sec('Attachments ('+(t.attachments||[]).length+')',att);
  if(!t.content&&!t.deploy&&!t.backout&&!(t.attachments||[]).length)
    html+=`<div style="color:var(--muted);font-size:12px">No details yet — click Edit and open Advanced to add description, plans or attachments.</div>`;
  $('ddBody').innerHTML=html;
  $('ddEdit').onclick=()=>{$('dlgDetail').close();openDlg(id)};
  $('dlgDetail').showModal();
}
$('ddClose').onclick=()=>$('dlgDetail').close();

$('fileInput').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{
    const j=JSON.parse(r.result);
    tasks=Array.isArray(j)?j:j.tasks;
    if(!Array.isArray(tasks))throw 0;

    save();render();
  }catch{alert('Invalid JSON')}};
  r.readAsText(f);e.target.value='';
};

const STATUS_NAME={todo:'Not Started',doing:'In Progress',paused:'Paused',done:'Done'};

// --- minimal real-.xlsx writer: ZIP (stored) + OOXML parts ---
function crc32(u8){
  if(!crc32.t){crc32.t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;crc32.t[n]=c>>>0}}
  let c=0xFFFFFFFF;for(const b of u8)c=crc32.t[(c^b)&0xFF]^(c>>>8);return(c^0xFFFFFFFF)>>>0;
}
function xlsxBlob(files){
  const enc=new TextEncoder(),out=[],central=[];let off=0;
  for(const f of files){
    const name=enc.encode(f.name),data=enc.encode(f.data),crc=crc32(data);
    const lh=new DataView(new ArrayBuffer(30));
    lh.setUint32(0,0x04034b50,true);lh.setUint16(4,20,true);lh.setUint32(14,crc,true);
    lh.setUint32(18,data.length,true);lh.setUint32(22,data.length,true);lh.setUint16(26,name.length,true);
    out.push(new Uint8Array(lh.buffer),name,data);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);
    ch.setUint32(16,crc,true);ch.setUint32(20,data.length,true);ch.setUint32(24,data.length,true);
    ch.setUint16(28,name.length,true);ch.setUint32(42,off,true);
    central.push([new Uint8Array(ch.buffer),name]);off+=30+name.length+data.length;
  }
  const cdStart=off;const cdLen=central.reduce((a,[b,n])=>a+b.length+n.length,0);
  const eo=new DataView(new ArrayBuffer(22));
  eo.setUint32(0,0x06054b50,true);eo.setUint16(8,central.length,true);eo.setUint16(10,central.length,true);
  eo.setUint32(12,cdLen,true);eo.setUint32(16,cdStart,true);
  return new Blob([...out,...central.flat(),new Uint8Array(eo.buffer)],
    {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
const COLREF=i=>{let s='';i++;while(i>0){s=String.fromCharCode(65+(i-1)%26)+s;i=(i-1)/26|0}return s};

$('btnExcel').onclick=()=>{
  const list=sortTasks(visible());
  const vc=visCols();
  const fonts=['<font><sz val="11"/><name val="Calibri"/></font>',
    '<font><b/><sz val="11"/><name val="Calibri"/></font>',
    '<font><b/><sz val="11"/><color rgb="FFFFFFFF"/><name val="Calibri"/></font>',
    '<font><b/><sz val="14"/><name val="Calibri"/></font>'];
  const fills=['<fill><patternFill/></fill>','<fill><patternFill patternType="gray125"/></fill>',
    '<fill><patternFill patternType="solid"><fgColor rgb="FFD9E1F2"/><bgColor indexed="64"/></patternFill></fill>'];
  const thin='<left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom>';
  const xf=(font,fill,numFmt,align)=>`<xf numFmtId="${numFmt||0}" fontId="${font||0}" fillId="${fill||0}" borderId="1" xfId="0"${numFmt?' applyNumberFormat="1"':''}${font?' applyFont="1"':''}${fill?' applyFill="1"':''} applyBorder="1">${align?`<alignment horizontal="${align}" vertical="center"/>`:'<alignment vertical="center"/>'}</xf>`;
  const S={def:0,title:1,hdr:2,txt:3,ctr:4,pct:5};
  const xfs=[xf(0,0,0),xf(3,0,0),xf(1,2,0,'center'),xf(0,0,0),xf(0,0,0,'center'),xf(0,0,9,'center')];
  const stylesXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<fonts count="${fonts.length}">${fonts.join('')}</fonts>
<fills count="${fills.length}">${fills.join('')}</fills>
<borders count="2"><border/><border>${thin}</border></borders>
<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>
<cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs></styleSheet>`;

  const cell=(r,c,s,inner,type)=>`<c r="${COLREF(c)}${r}" s="${s}"${type?` t="${type}"`:''}>${inner||''}</c>`;
  const scell=(r,c,s,v)=>cell(r,c,s,`<is><t${/^\s|\s$/.test(v)?' xml:space="preserve"':''}>${esc(v)}</t></is>`,'inlineStr');
  const row=(r,x,ht)=>`<row r="${r}"${ht?` ht="${ht}" customHeight="1"`:''}>${x}</row>`;
  let rows='';

  rows+=row(1,cell(1,0,S.title,`<is><t>Workload — ${fmt(today())}</t></is>`,'inlineStr'),24);
  rows+=row(2,vc.map((c,i)=>scell(2,i,S.hdr,c.label)).join(''),20);
  const val=(c,t)=>{
    switch(c.id){
      case 'name':return {s:S.txt,t:t.name};
      case 'content':return {s:S.txt,t:t.content||t.note||''};
      case 'who':return {s:S.ctr,t:t.who};
      case 'ddl':return {s:S.ctr,t:t.ddl||''};
      case 'status':return {s:S.ctr,t:STATUS_NAME[t.status]||t.status};
      case 'prog':return {s:S.pct,n:t.prog/100};
    }
    const v=(t.cv&&t.cv[c.id])??'';
    if(c.type==='number'&&v!==''&&!isNaN(+v))return {s:S.ctr,n:+v};
    return {s:c.type==='text'?S.txt:S.ctr,t:String(v)};
  };
  list.forEach((t,ri)=>{
    const r=ri+3;
    rows+=row(r,vc.map((c,i)=>{
      const v=val(c,t);
      return v.t!==undefined?scell(r,i,v.s,v.t):cell(r,i,v.s,`<v>${v.n}</v>`);
    }).join(''),18);
  });

  const colsXml=vc.map((c,i)=>`<col min="${i+1}" max="${i+1}" width="${Math.max(8,Math.round(c.w/7))}" customWidth="1"/>`).join('');
  const sheetXml=`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">
<sheetViews><sheetView showGridLines="0" workbookViewId="0"/></sheetViews>
<cols>${colsXml}</cols><sheetData>${rows}</sheetData></worksheet>`;
  const blob=xlsxBlob([
    {name:'[Content_Types].xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">
<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>
<Default Extension="xml" ContentType="application/xml"/>
<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>
<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>
<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>
</Types>`},
    {name:'_rels/.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>
</Relationships>`},
    {name:'xl/workbook.xml',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">
<sheets><sheet name="Tasks" sheetId="1" r:id="rId1"/></sheets></workbook>`},
    {name:'xl/_rels/workbook.xml.rels',data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?>
<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">
<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>
<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>
</Relationships>`},
    {name:'xl/styles.xml',data:stylesXml},
    {name:'xl/worksheets/sheet1.xml',data:sheetXml},
  ]);
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download='Workload-'+fmt(today())+'.xlsx';a.click();
};

// 导出只读快照: 序列化整个页面 + 注入数据, 重开后自动进入只读模式
$('btnSnap').onclick=()=>{
  $('dlg').close();
  const data=JSON.stringify({tasks,generated:fmt(today()),cols:COLS,viewMonth:fmt(viewMonth),hideDone:$('chkDone').checked}).replace(/<\//g,'<\\/');
  const inject=`<script type="application/json" id="snapshot-data">`+data+`<`+`/script>`;
  const ut=$('userText').textContent;$('userText').textContent='';
  let html='<!DOCTYPE html>\n'+document.documentElement.outerHTML;

  html=html.replace('</head>',inject+'</head>');
  download('workload-snapshot-'+fmt(today())+'.html',html,'text/html');
};

// ----- column manager -----
let draft=[];
function drawColEditor(){
  $('colList').innerHTML=draft.map((c,i)=>`<div class="colrow" data-i="${i}">
    <span><button data-act="up" ${i===0?'disabled':''}>↑</button><button data-act="down" ${i===draft.length-1?'disabled':''}>↓</button></span>
    <input type="checkbox" data-act="vis" ${c.visible?'checked':''} title="Show / hide column">
    <input type="text" data-act="label" value="${esc(c.label)}">
    ${c.builtin?'<span class="tag">built-in</span>':`<select data-act="type">${['text','dropdown','date','number'].map(ty=>`<option value="${ty}" ${c.type===ty?'selected':''}>${({text:'Text',dropdown:'Dropdown',date:'Date',number:'Number'})[ty]}</option>`).join('')}</select>`}
    ${c.builtin?'<span></span>':'<button data-act="del" title="Delete column">✕</button>'}
    ${!c.builtin&&c.type==='dropdown'?`<input type="text" class="opts" data-act="opts" placeholder="Options, comma separated (e.g. High, Medium, Low)" value="${esc((c.options||[]).join(', '))}">`:''}
  </div>`).join('');
}
$('colList').addEventListener('click',e=>{
  const b=e.target.closest('button[data-act]');if(!b)return;
  const i=+b.closest('.colrow').dataset.i,a=b.dataset.act;
  if(a==='up'&&i>0)[draft[i-1],draft[i]]=[draft[i],draft[i-1]];
  else if(a==='down'&&i<draft.length-1)[draft[i+1],draft[i]]=[draft[i],draft[i+1]];
  else if(a==='del'){if(!confirm('Delete column "'+draft[i].label+'"? Values entered in it will be removed from view.'))return;draft.splice(i,1)}
  drawColEditor();
});
$('colList').addEventListener('change',e=>{if(e.target.dataset.act==='type'){const c=draft[+e.target.closest('.colrow').dataset.i];c.type=e.target.value;drawColEditor()}});
$('colList').addEventListener('input',e=>{
  const a=e.target.dataset.act;if(!a)return;
  const c=draft[+e.target.closest('.colrow').dataset.i];
  if(a==='label')c.label=e.target.value;
  else if(a==='vis')c.visible=e.target.checked;
  else if(a==='opts')c.options=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);
});
$('btnLabels').onclick=()=>{draft=COLS.map(c=>({...c,options:c.options?[...c.options]:undefined}));drawColEditor();$('dlgLabels').showModal()};
$('lAdd').onclick=()=>{
  const name=$('newColName').value.trim();if(!name){$('newColName').focus();return}
  const type=$('newColType').value;
  draft.push({id:'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),label:name,builtin:false,visible:true,w:130,type,options:[]});

$('lCancel').onclick=()=>$('dlgLabels').close();
$('lReset').onclick=()=>{

$('lChinese').onclick=()=>{draft.forEach(c=>{if(c.builtin)c.label=CN_LABELS[c.id]});drawColEditor()};
$('lSave').onclick=()=>{
  draft.forEach(c=>{c.label=c.label.trim()||EN_LABELS[c.id]||'Column'});
  COLS=draft;saveCols();$('dlgLabels').close();render();
};

const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3c2dnem93amlibndibmxsY3R6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY1MDE2ODMsImV4cCI6MjEwMjA3NzY4M30.F5gsxD_CwyQ_txBzI6qb-RboTXioF5UaKJDCNRCVlH4';
const LOGIN_DOMAIN='gantt.invalid';
const toEmail=u=>u.includes('@')?u:u.toLowerCase()+'@'+LOGIN_DOMAIN;
const shortName=e=>e.endsWith('@'+LOGIN_DOMAIN)?e.slice(0,-LOGIN_DOMAIN.length-1):e;
let sb=null,role=null,saveTimer=null,lastTs=0,knownTs=0,entered=null,channel=null,pollTimer=null;

function setSync(s){
  const el=$('syncStatus');if(MODE!=='cloud'){el.style.display='none';return}
  const m={live:['● Live','live'],saving:['Saving…',''],error:['⚠ Not saved','err'],offline:['○ Reconnecting…','err']}[s];
  el.style.display='';el.textContent=m[0];el.className='sync '+m[1];
}
function showGate(msg,opts={}){
  $('gate').style.display='flex';
  if(msg)$('gateMsg').textContent=msg;
  $('gateForm').style.display=opts.noForm?'none':'';
  $('gateOut').style.display=opts.signout?'':'none';
  $('gateLocal').style.display=opts.noForm?'none':'';
}
function gateNote(t,err){$('gateNote').textContent=t;$('gateNote').className=err?'err':''}
function teardown(){
  if(channel&&sb){sb.removeChannel(channel);channel=null}
  clearInterval(pollTimer);clearTimeout(saveTimer);saveTimer=null;role=null;
  $('userBox').style.display='none';$('syncStatus').style.display='none';
}
function applyRemote(row){
  tasks=Array.isArray(row.tasks)?row.tasks:[];
  COLS=row.cols?normCols(row.cols):defaultCols();
  knownTs=new Date(row.updated_at).getTime();
}
function incoming(row){
  const ts=new Date(row.updated_at).getTime();
  if(ts<=lastTs||ts<=knownTs||saveTimer)return;
  applyRemote(row);render();
}
async function pull(){
  if(!sb||MODE!=='cloud'||!role||document.hidden||saveTimer)return;
  const {data}=await sb.from('gantt_state').select('tasks,cols,updated_at').eq('id',1).maybeSingle();
  if(data)incoming(data);
}
function cloudSave(){
  if(MODE!=='cloud'||role!=='owner')return;
  clearTimeout(saveTimer);setSync('saving');
  saveTimer=setTimeout(async()=>{
    saveTimer=null;
    const ts=Date.now();lastTs=ts;
    const {data,error}=await sb.from('gantt_state').update({tasks,cols:COLS,updated_at:new Date(ts).toISOString()}).eq('id',1).select('id');
    if(error||!data||!data.length){setSync('error');console.error(error||'update affected 0 rows');return}
    knownTs=ts;if(!saveTimer)setSync('live');
  },500);
}
async function enter(session){
  const email=session.user.email||'';
  $('gate').style.display='none';
  const {data:r,error:re}=await sb.rpc('gantt_role');
  if(re){entered=null;showGate('Could not reach the database ('+re.message+'). Please try again in a minute.',{noForm:true,signout:true});return}
  if(!r){showGate(shortName(email)+' does not have access to this schedule. Ask the owner to add this account.',{noForm:true,signout:true});return}
  role=r;SNAPSHOT=role!=='owner';
  document.querySelectorAll('.edit-only').forEach(e=>e.style.display=SNAPSHOT?'none':'');
  $('userText').textContent=shortName(email)+' · '+(SNAPSHOT?'Viewer':'Owner');$('userBox').style.display='';
  const {data,error}=await sb.from('gantt_state').select('tasks,cols,updated_at').eq('id',1).maybeSingle();
  if(error||!data){entered=null;role=null;showGate('Could not load the schedule'+(error?' ('+error.message+')':'')+'.',{noForm:true,signout:true});return}
  applyRemote(data);
  if(role==='owner'&&!tasks.length){
    const lt=localStorage.getItem('gantt-tasks');
    if(lt&&confirm('The cloud schedule is empty. Upload the tasks saved in this browser?')){
      tasks=JSON.parse(lt);const lc=localStorage.getItem('gantt-cols');if(lc)COLS=normCols(JSON.parse(lc));
      cloudSave();
    }
  }
  render();
  channel=sb.channel('gantt-state').on('postgres_changes',{event:'*',schema:'public',table:'gantt_state'},p=>{if(p.new&&p.new.tasks)incoming(p.new)})
    .subscribe(st=>{if(st==='SUBSCRIBED')setSync('live');else if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')setSync('offline')});
  pollTimer=setInterval(pull,30000);
  setSync('live');
}
async function onSession(session){
  if(MODE==='local')return;
  if(!session){entered=null;teardown();tasks=[];render();showGate('Sign in to view the live schedule.');return}
  if(entered===session.user.id)return;
  entered=session.user.id;
  await enter(session);
}
function startCloud(){
  if(!window.supabase){showGate('Could not load the sign-in library. Check your connection and reload.',{noForm:true});return}
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  sb.auth.onAuthStateChange((ev,session)=>{setTimeout(()=>onSession(session),0)});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)pull()});
}
$('gateSend').onclick=async()=>{
  const email=$('gateEmail').value.trim(),password=$('gatePass').value;
  if(!email){$('gateEmail').focus();return}
  if(!password){$('gatePass').focus();return}
  const btn=$('gateSend');btn.disabled=true;gateNote('Signing in…');
  const {error}=await sb.auth.signInWithPassword({email:toEmail(email),password});
  btn.disabled=false;
  if(error){gateNote(/invalid login/i.test(error.message)?'Wrong email or password.':error.message,true);return}
  gateNote('');$('gatePass').value='';
};
['gateEmail','gatePass'].forEach(id=>$(id).addEventListener('keydown',e=>{if(e.key==='Enter')$('gateSend').click()}));
const signOut=()=>sb&&sb.auth.signOut();
$('gateOut').onclick=signOut;$('btnSignOut').onclick=signOut;
$('gateLocal').onclick=e=>{
  e.preventDefault();
  MODE='local';SNAPSHOT=false;loadLocal();teardown();
  $('gate').style.display='none';
  document.querySelectorAll('.edit-only').forEach(x=>x.style.display='');
  $('userText').textContent='Local mode (this browser only)';$('userBox').style.display='';$('btnSignOut').style.display='none';
  render();
};

if(MODE==='snapshot'){render()}
else{render();showGate('Loading…',{noForm:true});startCloud()}
